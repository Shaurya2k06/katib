# Katib release automation aligned with kubeflow/trainer.
# Ref: https://github.com/kubeflow/katib/issues/2049
name: Release

on:
  push:
    branches:
      - master
      - "release-*"
    paths:
      - VERSION

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SEMVER_PATTERN: '^(v)?([0-9]+)\.([0-9]+)\.([0-9]+)(-rc\.([0-9]+))?$'

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.vars.outputs.version }}
      tag: ${{ steps.vars.outputs.tag }}
      branch: ${{ steps.vars.outputs.branch }}
      is-prerelease: ${{ steps.vars.outputs.is-prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version and set outputs
        id: vars
        shell: bash
        run: |
          RAW_VERSION=$(tr -d ' \n' < VERSION)
          VERSION=${RAW_VERSION#v}
          if [[ ! ${RAW_VERSION} =~ ${{ env.SEMVER_PATTERN }} ]]; then
            echo "Version '${RAW_VERSION}' does not match semver pattern."
            exit 1
          fi

          MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1,2)
          BRANCH="release-${MAJOR_MINOR}"
          TAG="v${VERSION}"
          IS_PRERELEASE=false
          if [[ ${VERSION} == *"-rc."* ]]; then
            IS_PRERELEASE=true
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "branch=${BRANCH}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "is-prerelease=${IS_PRERELEASE}" >> $GITHUB_OUTPUT

      - name: Ensure tag does not exist
        shell: bash
        run: |
          git fetch --tags
          if git tag -l | grep -q "^${{ steps.vars.outputs.tag }}$"; then
            echo "Tag '${{ steps.vars.outputs.tag }}' already exists."
            exit 1
          fi

      - name: Check Python package versions
        shell: bash
        run: |
          VERSION="${{ steps.vars.outputs.version }}"
          EXPECTED=$(echo "$VERSION" | sed 's/-rc\.\([0-9]*\)/rc\1/')
          SDK_VERSION=$(grep -E 'version="[^"]+"' sdk/python/v1beta1/setup.py | head -1 | sed -E 's/.*version="([^"]+)".*/\1/')
          API_VERSION=$(grep 'API_VERSION=' hack/python-api/gen-api.sh | head -1 | sed -E 's/.*API_VERSION="([^"]+)".*/\1/')
          MODELS_VERSION=$(grep '__version__' api/python_api/kubeflow_katib_api/__init__.py | sed -E 's/.*"([^"]+)".*/\1/')

          echo "Expected: ${EXPECTED}"
          echo "SDK: ${SDK_VERSION}, API: ${API_VERSION}, Models: ${MODELS_VERSION}"

          if [[ "${SDK_VERSION}" != "${EXPECTED}" || "${API_VERSION}" != "${EXPECTED}" || "${MODELS_VERSION}" != "${EXPECTED}" ]]; then
            echo "Python package versions do not match VERSION."
            exit 1
          fi

  tests:
    name: Tests
    needs: [prepare]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run unit tests
        run: make test

  build_python_packages:
    name: Build Python packages
    needs: [prepare]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build Katib SDK
        working-directory: sdk/python/v1beta1
        run: python -m build

      - name: Build Katib API models
        working-directory: api/python_api
        run: python -m build

      - name: Validate packages
        run: |
          twine check sdk/python/v1beta1/dist/*
          twine check api/python_api/dist/*

      - name: Upload SDK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-sdk-${{ needs.prepare.outputs.version }}
          path: sdk/python/v1beta1/dist/

      - name: Upload API artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-api-${{ needs.prepare.outputs.version }}
          path: api/python_api/dist/

  update_release_branch:
    name: Update release branch
    needs: [prepare, build_python_packages, tests]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create or checkout release branch
        shell: bash
        run: |
          BRANCH="${{ needs.prepare.outputs.branch }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            echo "Release branch $BRANCH already exists, checking it out."
            git fetch origin "$BRANCH"
            git checkout "$BRANCH"
            git pull origin "$BRANCH"
          else
            echo "Creating release branch $BRANCH from $GITHUB_SHA"
            git checkout -b "$BRANCH" "$GITHUB_SHA"
          fi

      - name: Pin manifest image tags on release branch
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          bash scripts/v1beta1/update-images.sh ghcr.io/kubeflow/katib/ ghcr.io/kubeflow/katib/ "$TAG"

      - name: Commit and push release branch
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          BRANCH="${{ needs.prepare.outputs.branch }}"
          if git diff --quiet; then
            echo "No manifest changes needed."
          else
            git add manifests/
            git commit -s -m "Pin manifest image tags to ${TAG}"
          fi
          git push origin "$BRANCH"

  publish_pypi:
    name: Publish to PyPI
    if: ${{ !cancelled() && !failure() }}
    needs: [prepare, build_python_packages, tests, update_release_branch]
    runs-on: ubuntu-22.04
    environment:
      name: release
      url: https://pypi.org/project/kubeflow-katib/
    steps:
      - name: Download SDK artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-sdk-${{ needs.prepare.outputs.version }}
          path: dist-sdk/

      - name: Download API artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-api-${{ needs.prepare.outputs.version }}
          path: dist-api/

      - name: Publish Katib SDK to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-sdk/
          skip-existing: true

      - name: Publish Katib API models to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-api/
          skip-existing: true

  github_release:
    name: Create GitHub Release
    if: ${{ !cancelled() && !failure() }}
    needs: [prepare, update_release_branch, publish_pypi]
    runs-on: ubuntu-22.04
    environment:
      name: release
      url: https://github.com/kubeflow/katib/releases
    permissions:
      contents: write

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.branch }}

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: >
            --unreleased
            --tag ${{ needs.prepare.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        shell: bash
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          TAG_SHA=$(git rev-parse HEAD)
          git tag -a "${TAG}" "${TAG_SHA}" -m "Kubeflow Katib ${TAG}"
          git push origin "${TAG}"

      - name: Download SDK artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-sdk-${{ needs.prepare.outputs.version }}
          path: dist-sdk/

      - name: Download API artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-api-${{ needs.prepare.outputs.version }}
          path: dist-api/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ needs.prepare.outputs.tag }}
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.branch }}
          prerelease: ${{ needs.prepare.outputs.is-prerelease == 'true' }}
          draft: false
          body_path: ${{ steps.changelog.outputs.changelog }}
          files: |
            dist-sdk/*
            dist-api/*

  trigger_builds:
    name: Publish release images
    needs: [prepare, github_release]
    uses: ./.github/workflows/publish-release-images.yaml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
